<style>
:root{
  --p1:#0b3d91;--p2:#1e88e5;--p3:#00c6ff;
  --bg:#eef3fb;--card:#fff;--text:#16233b;--muted:#6b7a94;
  --ok:#12a150;--okbg:#e3f8ec;--bad:#e5383b;--badbg:#fdeaea;--line:#e3e9f4;
  --shadow:0 6px 20px rgba(11,61,145,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:90px}
button{font-family:inherit;cursor:pointer;border:0}
input,select{font-family:inherit;font-size:16px}
.hidden{display:none!important}

/* ---------- Login ---------- */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(circle at 20% 10%,#1e88e5 0,transparent 45%),radial-gradient(circle at 90% 90%,#00c6ff 0,transparent 40%),linear-gradient(160deg,#071f4d,#0b3d91);}
.login-card{background:rgba(255,255,255,.97);border-radius:28px;padding:30px 24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
.login-card .logo{margin:-70px auto 8px;width:104px;height:104px;border-radius:50%;background:#fff;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.login-card h1{margin:10px 0 2px;font-size:28px;color:var(--p1);letter-spacing:.3px}
.login-card p{margin:0 0 20px;color:var(--muted);font-size:14px}
.field{position:relative;margin-bottom:12px;text-align:left}
.field input{width:100%;padding:14px 14px 14px 46px;border:2px solid var(--line);border-radius:14px;background:#f7faff;outline:none;transition:.2s}
.field input:focus{border-color:var(--p2);background:#fff}
.field .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px}
.btn-main{width:100%;padding:14px;border-radius:14px;font-size:17px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 8px 20px rgba(30,136,229,.4)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:6px 0}
.wrapL{margin-top:70px;width:100%;max-width:380px}

/* ---------- Header ---------- */
header{background:linear-gradient(135deg,#071f4d,var(--p1) 55%,var(--p2));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 70px;position:relative;z-index:1}
.top{display:flex;align-items:center;gap:10px}
.top .lg{width:46px;height:46px;border-radius:50%;background:#fff;padding:2px;flex:none}
.top .t{flex:1;min-width:0}
.top .t b{display:block;font-size:20px;line-height:1.1}
.top .t span{font-size:12px;opacity:.85}
.iconbtn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;font-size:18px}
.sync{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ffb703;margin-right:5px}
.sync.on{background:#38e08c}

.wrap{max-width:720px;margin:0 auto;padding:0 14px;position:relative;z-index:2}
.monthbar{margin-top:-52px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:10px;display:flex;align-items:center;gap:8px}
.monthbar button{width:42px;height:42px;border-radius:12px;background:#eaf2ff;color:var(--p1);font-size:20px;font-weight:700}
.monthbar .m{flex:1;text-align:center}
.monthbar .m b{display:block;font-size:19px;color:var(--p1)}
.monthbar .m small{color:var(--muted)}
.monthbar .m input{position:absolute;opacity:0;pointer-events:none}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.stat{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.stat .e{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:none}
.stat b{display:block;font-size:20px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.s1 .e{background:#e7f0ff}.s2 .e{background:var(--okbg)}.s3 .e{background:var(--badbg)}.s4 .e{background:#fff4dc}
.prog{margin-top:12px;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.prog .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.bar{height:12px;background:var(--badbg);border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#12a150,#38e08c);border-radius:20px;transition:width .5s}

/* ---------- Search ---------- */
.search{margin-top:14px;position:relative}
.search input{width:100%;padding:14px 16px 14px 46px;border-radius:16px;border:2px solid transparent;background:#fff;box-shadow:var(--shadow);outline:none}
.search input:focus{border-color:var(--p2)}
.search .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px}
.filters{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;padding:8px 14px;border-radius:30px;background:#fff;color:var(--muted);font-size:14px;font-weight:500;box-shadow:0 2px 8px rgba(11,61,145,.08)}
.chip.on{background:var(--p1);color:#fff}
.chip.ok.on{background:var(--ok)}.chip.bad.on{background:var(--bad)}
select.para{flex:none;padding:8px 12px;border-radius:30px;border:0;background:#fff;color:var(--text);box-shadow:0 2px 8px rgba(11,61,145,.08);font-size:14px;max-width:170px}
.count{margin:12px 4px 6px;color:var(--muted);font-size:13px}

/* ---------- Customer card ---------- */
.cust{background:var(--card);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow);border-left:5px solid var(--bad)}
.cust.paid{border-left-color:var(--ok)}
.cust .r1{display:flex;gap:12px;align-items:center}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;flex:none}
.info{flex:1;min-width:0}
.info b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .u{font-size:13px;color:var(--p2);font-weight:500}
.info .a{font-size:13px;color:var(--muted);margin-top:2px}
.pill{flex:none;padding:9px 12px;border-radius:30px;font-weight:600;font-size:14px;min-width:92px}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.cust .r2{display:flex;gap:8px;margin-top:10px;align-items:center}
.mini{flex:1;padding:8px;border-radius:10px;background:#f1f5fc;color:var(--p1);font-size:13px;font-weight:500;text-align:center;text-decoration:none;display:block}
.fee{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:56px}

/* ---------- FAB / modal ---------- */
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--p2),var(--p3));color:#fff;font-size:32px;box-shadow:0 10px 25px rgba(30,136,229,.55);z-index:20}
.ov{position:fixed;inset:0;background:rgba(7,20,50,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 12px;font-size:20px;color:var(--p1)}
.sheet label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.sheet input{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;outline:none;background:#f7faff}
.sheet input:focus{border-color:var(--p2);background:#fff}
.btnrow{display:flex;gap:8px;margin-top:16px}
.btnrow button{flex:1;padding:13px;border-radius:12px;font-size:16px;font-weight:600}
.b-cancel{background:#eef2f9;color:var(--muted)}
.b-save{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.b-del{background:var(--badbg);color:var(--bad)}
.hist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hm{padding:10px 4px;border-radius:12px;text-align:center;font-size:13px;font-weight:600}
.hm small{display:block;font-weight:400;font-size:11px;margin-top:2px}
.hm.ok{background:var(--okbg);color:var(--ok)}.hm.bad{background:var(--badbg);color:var(--bad)}

/* ---------- Guide ---------- */
.step{display:flex;gap:12px;align-items:center;background:#f4f8ff;border-radius:16px;padding:10px 12px;margin-bottom:8px}
.step .e{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:26px;flex:none;color:#fff}
.step b{display:block;font-size:15px}.step span{font-size:13px;color:var(--muted)}
.sect{background:#f4f8ff;border-radius:16px;padding:12px;margin-bottom:10px}
.sect h3{margin:0 0 6px;font-size:15px;color:var(--p1)}
.sect small{color:var(--muted);display:block;margin-top:4px;line-height:1.5}
.sect .mini{margin-top:8px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#16233b;color:#fff;padding:10px 18px;border-radius:30px;font-size:14px;z-index:99;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="wrapL">
    <div class="login-card">
      <div class="logo" id="loginLogo"></div>
      <h1>Bashir Network</h1>
      <p>ওয়াইফাই গ্রাহক ও বিল ম্যানেজমেন্ট</p>
      <div class="field"><span class="ic">👤</span><input id="lu" placeholder="এডমিন নাম" autocomplete="username" autocapitalize="off"></div>
      <div class="field"><span class="ic">🔒</span><input id="lp" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password"></div>
      <div class="err" id="lerr"></div>
      <button class="btn-main" id="lbtn">লগইন করুন</button>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header>
    <div class="top">
      <div class="lg" id="hdrLogo"></div>
      <div class="t"><b>Bashir Network</b><span><i class="sync" id="syncDot"></i><span id="syncTxt">লোকাল</span></span></div>
      <button class="iconbtn" id="btnHelp" title="সাহায্য">❓</button>
      <button class="iconbtn" id="btnSet" title="সেটিংস">⚙️</button>
      <button class="iconbtn" id="btnOut" title="লগআউট">⏻</button>
    </div>
  </header>

  <div class="wrap">
    <div class="monthbar">
      <button id="mPrev">‹</button>
      <div class="m" id="mTap"><b id="mName"></b><small>মাস পরিবর্তন করতে চাপুন</small><input type="month" id="mPick"></div>
      <button id="mNext">›</button>
    </div>

    <div class="stats">
      <div class="stat s1"><div class="e">👥</div><div><b id="stTotal">0</b><span>মোট গ্রাহক</span></div></div>
      <div class="stat s2"><div class="e">✅</div><div><b id="stPaid">0</b><span>বিল জমা দিয়েছে</span></div></div>
      <div class="stat s3"><div class="e">⏳</div><div><b id="stDue">0</b><span>বাকি আছে</span></div></div>
      <div class="stat s4"><div class="e">💰</div><div><b id="stMoney">৳০</b><span>আদায় হয়েছে</span></div></div>
    </div>
    <div class="prog">
      <div class="row"><span>এই মাসের আদায়</span><span id="stPct">০%</span></div>
      <div class="bar"><i id="barFill" style="width:0"></i></div>
      <div class="row" style="margin:6px 0 0"><span>বাকি টাকা</span><b id="stDueMoney" style="color:var(--bad)">৳০</b></div>
    </div>

    <div class="search"><span class="ic">🔍</span><input id="q" placeholder="নাম, ইউজার নাম, ঠিকানা বা পাড়া দিয়ে খুঁজুন" type="search"></div>
    <div class="filters">
      <button class="chip on" data-f="all">সব</button>
      <button class="chip ok" data-f="paid">✔ জমা দিয়েছে</button>
      <button class="chip bad" data-f="due">✖ বাকি</button>
      <select class="para" id="paraSel"><option value="">📍 সব পাড়া</option></select>
    </div>
    <div class="count" id="cnt"></div>
    <div id="list"></div>
  </div>
  <button class="fab" id="fab" title="নতুন গ্রাহক">＋</button>
</div>

<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================
   ☁️ FIREBASE কনফিগ — Firebase প্রজেক্টের firebaseConfig এর মান এখানে বসবে
   (ফাঁকা থাকলে অ্যাপ শুধু এই ফোনে লোকাল মোডে চলবে)
   ===================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCoR4OnC434DtnhK-eOhM0v-FUpeP-lCo0",
  authDomain: "bashir-network-2.firebaseapp.com",
  databaseURL: "https://bashir-network-2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bashir-network-2",
  appId: "1:571849062805:web:28a3f11de16a1ab4799e9c"
};
const CLOUD = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL && typeof firebase!=='undefined');
const ADMIN_EMAIL = "bashir@bashirnetwork.app"; // Firebase Auth এ এডমিনের ইমেইল (ভেতরের ব্যবহারের জন্য)

const ADMIN = {name:"Bashir", pass:"basir1234"};
const LS_DATA="bn_data_v1", LS_AUTH="bn_auth";

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const bn=n=>Number(n||0).toLocaleString('bn-BD');
const money=n=>'৳'+bn(n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const monthKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const monthLabel=k=>{const [y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('bn-BD',{month:'long',year:'numeric'})};
const monthShort=k=>{const [y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('bn-BD',{month:'short'})};
function shiftMonth(k,n){const [y,m]=k.split('-').map(Number);return monthKey(new Date(y,m-1+n,1))}
const COLORS=['#1e88e5','#8e24aa','#00897b','#f4511e','#3949ab','#d81b60','#43a047','#fb8c00','#546e7a','#6d4c41'];
const colorOf=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}

/* ---------- logo ---------- */
function logoSVG(id){return `<svg viewBox="0 0 120 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b3d91"/><stop offset="1" stop-color="#00c6ff"/></linearGradient>
<linearGradient id="h${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#bfe9ff"/></linearGradient>
</defs>
<circle cx="60" cy="60" r="56" fill="url(#g${id})"/>
<circle cx="60" cy="60" r="50" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
<g fill="none" stroke="url(#h${id})" stroke-width="8" stroke-linecap="round">
<path d="M24 52a50 50 0 0 1 72 0"/><path d="M35 63a34 34 0 0 1 50 0"/><path d="M47 74a17 17 0 0 1 26 0"/>
</g>
<circle cx="60" cy="86" r="6.5" fill="#fff"/>
<text x="60" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="13" fill="#fff" letter-spacing="1.5">BASHIR</text>
</svg>`}
$('#loginLogo').innerHTML=logoSVG('a');
$('#hdrLogo').innerHTML=logoSVG('b');

/* ---------- data layer ---------- */
let db={customers:{},payments:{},settings:{fee:500}};
let state={month:monthKey(new Date()),filter:'all',para:'',q:''};
let fbRef=null, fbOn=false;

function normalize(d){d=d||{};return{customers:d.customers||{},payments:d.payments||{},settings:Object.assign({fee:500},d.settings||{})}}
function loadLocal(){try{db=normalize(JSON.parse(localStorage.getItem(LS_DATA)))}catch(e){db=normalize()}}
function saveLocal(){try{localStorage.setItem(LS_DATA,JSON.stringify(db))}catch(e){}}

function setData(path,val){
  const parts=path.split('/');let o=db;
  for(let i=0;i<parts.length-1;i++){if(typeof o[parts[i]]!=='object'||o[parts[i]]===null)o[parts[i]]={};o=o[parts[i]]}
  const k=parts[parts.length-1];
  if(val===null)delete o[k];else o[k]=val;
  saveLocal();
  if(fbRef){fbRef.child(path).set(val).catch(()=>toast('⚠️ সিঙ্ক ব্যর্থ — ইন্টারনেট/রুলস চেক করুন'))}
  render();
}

function initFirebase(){
  if(!CLOUD){setSync(false);return}
  try{
    fbRef=firebase.database().ref('bashir_network');
    let first=true;
    fbRef.on('value',snap=>{
      const v=snap.val();
      if(first&&v===null&&Object.keys(db.customers).length){fbRef.set(db)}
      else{db=normalize(v);saveLocal()}
      first=false;setSync(true);render();
    },()=>{setSync(false);toast('⚠️ ডাটাবেসে সংযোগ করা যায়নি (অনুমতি নেই)')});
    firebase.database().ref('.info/connected').on('value',s=>setSync(!!s.val()));
  }catch(e){fbRef=null;setSync(false)}
}
function setSync(on){fbOn=on;$('#syncDot').classList.toggle('on',on);$('#syncTxt').textContent=on?'ক্লাউড সিঙ্ক চালু':(fbRef?'অফলাইন…':'লোকাল (শুধু এই ফোন)')}

/* ---------- login ---------- */
let loginBusy=false;
async function doLogin(){
  if(loginBusy)return;
  const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value;
  $('#lerr').textContent='';
  if(!(u===ADMIN.name.toLowerCase()&&p===ADMIN.pass)){$('#lerr').textContent='❌ এডমিন নাম বা পাসওয়ার্ড ভুল';return}
  if(!CLOUD){try{localStorage.setItem(LS_AUTH,'1')}catch(e){};enter();return}
  loginBusy=true;$('#lbtn').textContent='অপেক্ষা করুন…';
  try{
    const auth=firebase.auth();
    try{await auth.signInWithEmailAndPassword(ADMIN_EMAIL,p)}
    catch(e){
      if(['auth/user-not-found','auth/invalid-credential','auth/invalid-login-credentials'].includes(e.code)){
        await auth.createUserWithEmailAndPassword(ADMIN_EMAIL,p);
      }else throw e;
    }
  }catch(e){
    const m={'auth/network-request-failed':'ইন্টারনেট সংযোগ নেই','auth/operation-not-allowed':'Firebase এ Email/Password চালু করা হয়নি','auth/too-many-requests':'অনেকবার ভুল হয়েছে, কিছুক্ষণ পর চেষ্টা করুন','auth/email-already-in-use':'অ্যাডমিন অ্যাকাউন্ট আগে থেকেই আছে, কিন্তু পাসওয়ার্ড মেলেনি'}[e.code]||('ত্রুটি: '+(e.code||e.message));
    $('#lerr').textContent='❌ '+m;
  }
  loginBusy=false;$('#lbtn').textContent='লগইন করুন';
}
$('#lbtn').onclick=doLogin;
$('#lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
function enter(){if(!$('#app').classList.contains('hidden'))return;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');initFirebase();render()}
$('#btnOut').onclick=async()=>{if(confirm('লগআউট করবেন?')){localStorage.removeItem(LS_AUTH);if(CLOUD){try{await firebase.auth().signOut()}catch(e){}}location.reload()}};

/* ---------- render ---------- */
function paidInfo(id,m=state.month){const p=(db.payments[m]||{})[id];return p&&p.paid?p:null}
function render(){
  if($('#app').classList.contains('hidden'))return;
  const m=state.month, all=Object.entries(db.customers).map(([id,c])=>({id,...c}));
  $('#mName').textContent=monthLabel(m);

  // stats
  let paid=0,money_=0,dueMoney=0;
  all.forEach(c=>{const p=paidInfo(c.id);if(p){paid++;money_+=+p.amount||0}else dueMoney+=+c.fee||0});
  $('#stTotal').textContent=bn(all.length);$('#stPaid').textContent=bn(paid);$('#stDue').textContent=bn(all.length-paid);
  $('#stMoney').textContent=money(money_);$('#stDueMoney').textContent=money(dueMoney);
  const pct=all.length?Math.round(paid/all.length*100):0;
  $('#stPct').textContent=bn(pct)+'%';$('#barFill').style.width=pct+'%';

  // para dropdown
  const paras=[...new Set(all.map(c=>(c.para||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'bn'));
  const sel=$('#paraSel');
  sel.innerHTML='<option value="">📍 সব পাড়া</option>'+paras.map(p=>`<option value="${esc(p)}"${p===state.para?' selected':''}>${esc(p)}</option>`).join('');

  // filter
  const q=state.q.trim().toLowerCase();
  let rows=all.filter(c=>{
    if(state.para&&(c.para||'').trim()!==state.para)return false;
    const isPaid=!!paidInfo(c.id);
    if(state.filter==='paid'&&!isPaid)return false;
    if(state.filter==='due'&&isPaid)return false;
    if(q){const hay=[c.name,c.username,c.address,c.para,c.phone].join(' ').toLowerCase();if(!hay.includes(q))return false}
    return true;
  }).sort((a,b)=>(a.name||'').localeCompare(b.name||'','bn'));

  $('#cnt').textContent=rows.length?`${bn(rows.length)} জন গ্রাহক দেখানো হচ্ছে`:'';
  $('#list').innerHTML=rows.length?rows.map(card).join(''):`<div class="empty"><div class="big">${all.length?'🔎':'📶'}</div><b>${all.length?'কোনো গ্রাহক পাওয়া যায়নি':'এখনো কোনো গ্রাহক নেই'}</b><div>${all.length?'অন্য নাম বা ফিল্টার দিয়ে চেষ্টা করুন':'নিচের ＋ বাটনে চেপে প্রথম গ্রাহক যোগ করুন'}</div></div>`;
}
function card(c){
  const p=paidInfo(c.id);const ini=esc((c.name||'?').trim().charAt(0).toUpperCase());
  return `<div class="cust ${p?'paid':''}">
   <div class="r1">
     <div class="av" style="background:${colorOf(c.name||'')}">${ini}</div>
     <div class="info"><b>${esc(c.name)}</b><div class="u">@${esc(c.username)}</div>
       <div class="a">📍 ${esc(c.para||'—')}${c.address?' • '+esc(c.address):''}</div></div>
     <button class="pill ${p?'ok':'bad'}" data-pay="${c.id}">${p?'✔ জমা':'✖ বাকি'}</button>
   </div>
   <div class="r2">
     <button class="mini" data-hist="${c.id}">📅 ইতিহাস</button>
     <button class="mini" data-edit="${c.id}">✏️ এডিট</button>
     ${c.phone?`<a class="mini" href="tel:${esc(c.phone)}">📞 কল</a>`:''}
     <span class="fee">${money(c.fee)}/মাস</span>
   </div></div>`;
}

/* ---------- events ---------- */
$('#list').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.pay){const id=b.dataset.pay;const c=db.customers[id];
    if(paidInfo(id)){if(confirm(`${c.name} — এই মাসের "জমা" বাতিল করে "বাকি" করবেন?`))setData(`payments/${state.month}/${id}`,null)}
    else{setData(`payments/${state.month}/${id}`,{paid:true,amount:+c.fee||+db.settings.fee||0,date:todayStr()});toast(`✅ ${c.name} — বিল জমা হয়েছে`)}}
  if(b.dataset.edit)openForm(b.dataset.edit);
  if(b.dataset.hist)openHist(b.dataset.hist);
});
$('#q').addEventListener('input',e=>{state.q=e.target.value;render()});
document.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{state.filter=ch.dataset.f;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===ch));render()});
$('#paraSel').onchange=e=>{state.para=e.target.value;render()};
$('#mPrev').onclick=()=>{state.month=shiftMonth(state.month,-1);render()};
$('#mNext').onclick=()=>{state.month=shiftMonth(state.month,1);render()};
$('#mTap').onclick=()=>{const i=$('#mPick');i.value=state.month;try{i.showPicker?i.showPicker():i.click()}catch(e){i.click()}};
$('#mPick').onchange=e=>{if(e.target.value){state.month=e.target.value;render()}};
$('#fab').onclick=()=>openForm();
$('#btnHelp').onclick=openHelp;
$('#btnSet').onclick=openSettings;

/* ---------- modal ---------- */
function openModal(html){const m=$('#modal');m.innerHTML=`<div class="ov"><div class="sheet">${html}</div></div>`;m.querySelector('.ov').addEventListener('mousedown',e=>{if(e.target.classList.contains('ov'))closeModal()});}
function closeModal(){$('#modal').innerHTML=''}

function openForm(id){
  const c=id?db.customers[id]:{fee:db.settings.fee};
  const paras=[...new Set(Object.values(db.customers).map(x=>x.para).filter(Boolean))];
  openModal(`<h2>${id?'✏️ গ্রাহকের তথ্য পরিবর্তন':'➕ নতুন গ্রাহক যোগ করুন'}</h2>
  <label>নাম *</label><input id="f_name" value="${esc(c.name||'')}" placeholder="যেমন: রহিম উদ্দিন">
  <label>ইউজার নাম (ওয়াইফাই/PPPoE) *</label><input id="f_user" value="${esc(c.username||'')}" placeholder="যেমন: rahim01" autocapitalize="off">
  <label>পাড়ার নাম *</label><input id="f_para" list="paraList" value="${esc(c.para||'')}" placeholder="যেমন: উত্তর পাড়া"><datalist id="paraList">${paras.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
  <label>ঠিকানা</label><input id="f_addr" value="${esc(c.address||'')}" placeholder="বাড়ি/গ্রাম/রোড">
  <label>মোবাইল নম্বর</label><input id="f_phone" type="tel" value="${esc(c.phone||'')}" placeholder="01XXXXXXXXX">
  <label>মাসিক বিল (৳)</label><input id="f_fee" type="number" inputmode="numeric" value="${esc(c.fee??'')}">
  <div class="btnrow">${id?'<button class="b-del" id="f_del">🗑 মুছুন</button>':''}<button class="b-cancel" id="f_x">বাতিল</button><button class="b-save" id="f_ok">সংরক্ষণ</button></div>`);
  $('#f_x').onclick=closeModal;
  if(id)$('#f_del').onclick=()=>{if(confirm(`"${c.name}" কে স্থায়ীভাবে মুছে ফেলবেন? তার সব বিলের হিসাবও মুছে যাবে।`)){
    Object.keys(db.payments).forEach(m=>{if(db.payments[m][id])setData(`payments/${m}/${id}`,null)});
    setData(`customers/${id}`,null);closeModal();toast('গ্রাহক মুছে ফেলা হয়েছে')}};
  $('#f_ok').onclick=()=>{
    const name=$('#f_name').value.trim(),user=$('#f_user').value.trim(),para=$('#f_para').value.trim();
    if(!name||!user||!para){toast('নাম, ইউজার নাম ও পাড়া অবশ্যই দিন');return}
    const dup=Object.entries(db.customers).find(([k,x])=>k!==id&&(x.username||'').toLowerCase()===user.toLowerCase());
    if(dup&&!confirm(`ইউজার নাম "${user}" আগে থেকেই "${dup[1].name}" এর আছে। তবুও সংরক্ষণ করবেন?`))return;
    const obj={name,username:user,para,address:$('#f_addr').value.trim(),phone:$('#f_phone').value.trim(),fee:+$('#f_fee').value||0};
    setData(`customers/${id||uid()}`,obj);closeModal();toast(id?'✅ আপডেট হয়েছে':'✅ গ্রাহক যোগ হয়েছে');
  };
}

function openHist(id){
  const c=db.customers[id];const cur=monthKey(new Date());
  const months=[];for(let i=11;i>=0;i--)months.push(shiftMonth(cur,-i));
  openModal(`<h2>📅 ${esc(c.name)} — ১২ মাসের হিসাব</h2><p style="margin:0 0 10px;color:var(--muted);font-size:13px">যেকোনো মাসে চেপে জমা/বাকি পরিবর্তন করুন</p>
  <div class="hist">${months.map(m=>{const p=paidInfo(id,m);return `<button class="hm ${p?'ok':'bad'}" data-m="${m}">${p?'✔':'✖'} ${monthShort(m)}<small>${p?money(p.amount):'বাকি'}</small></button>`}).join('')}</div>
  <div class="btnrow"><button class="b-cancel" id="h_x">বন্ধ করুন</button></div>`);
  $('#h_x').onclick=closeModal;
  $('.hist').onclick=e=>{const b=e.target.closest('button');if(!b)return;const m=b.dataset.m;
    if(paidInfo(id,m))setData(`payments/${m}/${id}`,null);
    else setData(`payments/${m}/${id}`,{paid:true,amount:+c.fee||+db.settings.fee||0,date:todayStr()});
    openHist(id)};
}

function openHelp(){
  const S=[['🔐','#1e88e5','১. লগইন','এডমিন নাম ও পাসওয়ার্ড দিয়ে ঢুকুন'],
  ['➕','#8e24aa','২. গ্রাহক যোগ','নিচের ডানদিকের ＋ বাটনে চেপে নাম, ইউজার নাম, পাড়া ও ঠিকানা লিখুন'],
  ['🔍','#00897b','৩. খুঁজে বের করা','সার্চ বক্সে নাম/ইউজার নাম/ঠিকানা/পাড়া লিখুন, বা 📍 পাড়া সিলেক্ট করুন'],
  ['✅','#12a150','৪. বিল জমা','নামের পাশে লাল "✖ বাকি" বাটনে চাপ দিলে সবুজ "✔ জমা" হবে। আবার চাপলে বাতিল'],
  ['📅','#f4511e','৫. প্রতি মাসে আপডেট','উপরের ‹ › দিয়ে মাস বদলান। নতুন মাসে সবাই আপনা-আপনি "বাকি" দেখাবে'],
  ['📞','#3949ab','৬. কল ও ইতিহাস','কার্ডে 📅 ইতিহাস চাপলে ১২ মাসের হিসাব, 📞 কল চাপলে সরাসরি ফোন'],
  ['☁️','#d81b60','৭. অন্য মোবাইলে','একই লিংক খুলে একই এডমিন নাম ও পাসওয়ার্ড দিয়ে লগইন করলেই সব ফোনে একই ডাটা দেখা যাবে']];
  openModal(`<h2>❓ কিভাবে ব্যবহার করবেন</h2>${S.map(s=>`<div class="step"><div class="e" style="background:${s[1]}">${s[0]}</div><div><b>${s[2]}</b><span>${s[3]}</span></div></div>`).join('')}
  <div class="btnrow"><button class="b-save" id="x">বুঝেছি</button></div>`);
  $('#x').onclick=closeModal;
}

function openSettings(){
  openModal(`<h2>⚙️ সেটিংস</h2>
  <div class="sect"><h3>💵 ডিফল্ট মাসিক বিল</h3><input id="s_fee" type="number" inputmode="numeric" value="${esc(db.settings.fee)}"><small>নতুন গ্রাহক যোগ করার সময় এই টাকা আগে থেকে বসবে।</small></div>
  <div class="sect"><h3>☁️ ক্লাউড সিঙ্ক ও সুরক্ষা</h3>
    <div style="font-size:14px">অবস্থা: <b>${!CLOUD?'⚪ বন্ধ (শুধু এই ফোন)':fbOn?'🟢 চালু — লগইন সুরক্ষিত':'🟡 সংযোগ হচ্ছে/অফলাইন'}</b></div>
    <small>${CLOUD?'ডাটা শুধু লগইন করা এডমিন পড়তে/লিখতে পারে। সব ফোনে একই ডাটা দেখা যাবে।':'Firebase কনফিগ এখনো বসানো হয়নি।'}</small></div>
  <div class="sect"><h3>💾 ব্যাকআপ</h3>
    <button class="mini" id="s_exp" style="width:100%">⬇️ ব্যাকআপ ফাইল ডাউনলোড</button>
    <button class="mini" id="s_imp" style="width:100%">⬆️ ব্যাকআপ ফাইল থেকে ফেরত আনুন</button>
    <input type="file" id="s_file" accept=".json" class="hidden"></div>
  <div class="btnrow"><button class="b-cancel" id="s_x">বন্ধ</button><button class="b-save" id="s_ok">সংরক্ষণ</button></div>`);
  $('#s_x').onclick=closeModal;
  $('#s_ok').onclick=()=>{
    setData('settings/fee',+$('#s_fee').value||0);
    closeModal();toast('✅ সংরক্ষিত');
  };
  $('#s_exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download='bashir-network-backup-'+todayStr()+'.json';a.click()};
  $('#s_imp').onclick=()=>$('#s_file').click();
  $('#s_file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{
    const d=normalize(JSON.parse(r.result));if(!confirm('বর্তমান সব ডাটা মুছে ব্যাকআপের ডাটা বসানো হবে। নিশ্চিত?'))return;
    db=d;saveLocal();if(fbRef)fbRef.set(db);closeModal();render();toast('✅ ব্যাকআপ ফেরত এসেছে')}catch(err){toast('❌ ফাইলটি সঠিক নয়')}};r.readAsText(f)};
}

/* ---------- boot ---------- */
loadLocal();
if(CLOUD){
  try{firebase.initializeApp(FIREBASE_CONFIG);
    firebase.auth().onAuthStateChanged(u=>{if(u&&u.email===ADMIN_EMAIL)enter();});
  }catch(e){console.error(e)}
}else if(localStorage.getItem(LS_AUTH)==='1')enter();
</script>
</body>
</html>
